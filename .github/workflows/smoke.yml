# Prod smoke tests against https://app.usepostify.com — run manually before each
# release. They create DRAFTS ONLY and clean up after themselves. Every check skips
# loudly (never fails) when its credential secret is absent.
name: Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run prod smoke suite
        env:
          POSTIFY_API_KEY: ${{ secrets.POSTIFY_API_KEY }}
          POSTIFY_API_KEY_READONLY: ${{ secrets.POSTIFY_API_KEY_READONLY }}
        run: pytest tests/smoke -v -ra
