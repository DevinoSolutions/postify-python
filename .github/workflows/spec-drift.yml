# Weekly guard against silent SDK rot: the server can add a /v1 operation at any
# time, and `spec/v1.json` is vendored from a repo this one cannot see. Refresh it
# from the live (unauthenticated) spec endpoint and open a PR on any drift — the PR
# then fails `spec-parity` in CI until the SDK gains the missing method (PRD B5b).
name: Spec drift

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Refresh spec/v1.json from production
        run: bash scripts/sync-spec.sh
      - name: Open a PR on drift
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: spec/v1.json
          branch: spec-drift
          commit-message: "chore: sync spec/v1.json from production"
          title: "chore: /v1 OpenAPI spec drift"
          body: |
            `spec/v1.json` no longer matches `https://app.usepostify.com/v1/openapi.json`.

            If this adds or removes an operation, `spec-parity` will fail until the SDK
            gains (or drops) the matching method in `src/postify/_registry.py`.
