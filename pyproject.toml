[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "postify"
dynamic = ["version"]
description = "Official Python SDK for the Postify social publishing API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Devino Solutions Inc.", email = "support@usepostify.com" }]
keywords = [
  "postify",
  "social-media",
  "scheduling",
  "publishing",
  "api",
  "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.urls]
Homepage = "https://usepostify.com"
Documentation = "https://app.usepostify.com/docs/api-reference"
Repository = "https://github.com/DevinoSolutions/postify-python"
Issues = "https://github.com/DevinoSolutions/postify-python/issues"

[project.optional-dependencies]
# The dev toolchain floor is Python 3.10 (pytest 9 / pytest-asyncio 1.x).
# The library itself supports 3.9 — CI proves that in `build-and-import`.
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.16.0",
  "ty==0.0.63",
]

[tool.hatch.version]
path = "src/postify/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/postify"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "spec", "scripts", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "smoke: hits the real Postify production API; needs POSTIFY_API_KEY",
]

[tool.coverage.run]
source = ["postify"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
]
# The package supports Python 3.9, and pydantic *evaluates* model annotations at
# runtime — so `str | None` would raise TypeError on 3.9 even with
# `from __future__ import annotations`. Optional[...] / Union[...] stay until the
# 3.9 floor is dropped.
ignore = ["UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
# SIM117: `with client: with pytest.raises(...)` — the parenthesized single-with
# rewrite is 3.10+ syntax and the linter targets 3.9.
"tests/**" = ["B011", "E501", "SIM117"]

[tool.ty.environment]
python-version = "3.9"

[tool.ty.src]
include = ["src"]
